services:
  - type: web
    name: supervity-workbench
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: NVIDIA_MODEL
        value: meta/llama-3.1-8b-instruct
      - key: AUTO_RESOLUTION_THRESHOLD
        value: "0.90"
      - key: HUMAN_REVIEW_THRESHOLD
        value: "0.70"
      - key: AMOUNT_VARIANCE_THRESHOLD
        value: "0.10"
